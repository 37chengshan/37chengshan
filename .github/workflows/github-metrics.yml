name: github-metrics

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          filename: metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          config_display: large
          config_animations: no
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: lines-size
          # Commit SVG onto the shared output branch (same branch as snake/streak)
          committer_branch: output
          committer_message: "chore: update metrics.svg"
          extras_css: |
            section {
              accent-color: #c77dff;
            }
            header span {
              color: #c77dff;
            }

      - name: generate activity.svg (isocalendar)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          filename: activity.svg
          base: header
          config_timezone: Asia/Shanghai
          config_display: large
          config_animations: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          committer_branch: output
          committer_message: "chore: update activity.svg"
